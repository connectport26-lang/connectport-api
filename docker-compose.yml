services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: connectport
      POSTGRES_PASSWORD: connectport
      POSTGRES_DB: connectport
    volumes:
      - connectport_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U connectport -d connectport"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  connectport_pgdata:
